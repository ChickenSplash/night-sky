<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <title>ClickUp Space</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #040917; }
    body { font: 15px system-ui, sans-serif; color: #d6e4f4; }
    #space-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; background: #040917; z-index: 5; text-align: center; padding: 24px; }
    h1 { font-size: 22px; letter-spacing: .18em; font-weight: 500; }
    #status { color: #77a1ba; max-width: 600px; line-height: 1.6; }
  </style>
  <link rel="stylesheet" href="ui/panels.css">
</head>
<body>
  <div id="loading"><h1>CLICKUP / SPACE</h1><div id="status">Loading mission control…</div></div>
  <div id="app"><canvas id="space-canvas" tabindex="0"></canvas></div>
  <div id="hud" hidden></div>
  <script type="module">
    import { createBridge } from './ui/bridge.js';
    // `?ui=egui` shows the egui panels instead, for debugging.
    const htmlUi = new URLSearchParams(location.search).get('ui') !== 'egui';
    // Created before the renderer starts, so no state event is missed.
    const bridge = createBridge();
    window.spaceBridge = bridge;
    const canvas = document.querySelector('#space-canvas');
    const loading = document.querySelector('#loading');
    const status = document.querySelector('#status');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    const fail = message => {
      loading.style.display = 'grid';
      status.textContent = message;
    };
    window.addEventListener('error', event => {
      // winit uses this exception to transfer control to the browser event loop.
      if (!String(event.message).includes("Using exceptions for control flow")) {
        fail('The renderer could not start. ' + event.message);
      }
    });
    try {
      const probe = document.createElement('canvas');
      if (!probe.getContext('webgl2')) throw new Error('WebGL 2 is unavailable. Enable browser hardware acceleration.');
      const wasm = await import('./space_client.js');
      if (htmlUi) {
        document.querySelector('#hud').hidden = false;
        (await import('./ui/panels.js')).mount(bridge, canvas);
      }
      try {
        await wasm.default();
      } finally {
        bridge.connect(wasm.send_command);
      }
      loading.style.display = 'none';
      canvas.focus();
    } catch (error) {
      if (String(error).includes('Using exceptions for control flow')) {
        loading.style.display = 'none';
        canvas.focus();
      } else {
        fail(String(error));
        console.error(error);
      }
    }
  </script>
</body>
</html>
