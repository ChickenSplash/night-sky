<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Night Sky CEF overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    body { font: 14px system-ui, sans-serif; color: #d6e4f4; }
    button, input, textarea { font: inherit; color: inherit; background: #10233a; border: 1px solid #385269; border-radius: 10px; padding: 9px 12px; }
    button { cursor: pointer; }
    button:hover { background: #1b3b52; }
    :focus-visible { outline: 2px solid #63d6f0; outline-offset: 3px; }
    #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(370px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; padding: 22px; border-radius: 20px; border: 1px solid #385269; background: rgba(7, 15, 31, .96); box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
    #panel[data-position="top-right"] { left: auto; right: 24px; top: 24px; transform: none; }
    #panel[data-position="bottom-left"] { left: 24px; top: auto; bottom: 24px; transform: none; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 17px; margin: 0; }
    p { color: #9fb4ca; line-height: 1.5; }
    label { display: grid; gap: 8px; margin: 16px 0; }
    input { width: 100%; min-width: 0; }
    textarea { width: 100%; resize: vertical; }
    fieldset { border: 1px solid #385269; border-radius: 10px; margin: 16px 0; }
    fieldset label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    input[type="radio"] { width: auto; accent-color: #63d6f0; }
    button:disabled { opacity: .65; cursor: default; }
    .row { display: flex; align-items: center; gap: 12px; }
    output { color: #63d6f0; }
    #show { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); }
    [hidden] { display: none !important; }
    small { color: #9fb4ca; line-height: 1.5; display: block; margin-top: 16px; }
  </style>
</head>
<body>
  <section id="panel" aria-label="HTML overlay proof of concept">
    <header><h1>Native scene + HTML</h1><button id="close" aria-label="Hide HTML panel">×</button></header>
    <p>This panel is rendered by Chromium. The universe behind it is still native Bevy.</p>
    <label>Text field<input id="text" type="text" placeholder="Type here" autocomplete="off"></label>
    <div class="row"><button id="increment">Increment</button><output id="count" aria-live="polite">0</output></div>
    <fieldset><legend>Panel position</legend>
      <label><input type="radio" name="position" value="centre" checked>Centre</label>
      <label><input type="radio" name="position" value="top-right">Top right</label>
      <label><input type="radio" name="position" value="bottom-left">Bottom left</label>
    </fieldset>
    <div class="row"><button id="pause" disabled>Connecting to Rust…</button><output id="paused">Waiting</output></div>
    <p>Simulation: <output id="days">0.00000</output> days</p>
    <label>Scroll test<textarea rows="3" aria-label="Scroll and paste test">Scroll here without zooming the scene.
WASD, R/F and Q/E belong to HTML while focused.
Select this text, copy and paste.
Use Tab and Shift+Tab between controls.
Drag a selection outside the panel and release.
Escape returns keyboard focus to the scene.
Click empty space to fly again.
This is demo data only.</textarea></label>
    <small>Escape or an empty-space click returns focus to the scene. Readouts come from Rust at 10 Hz. Data source: built-in demo.</small>
  </section>
  <button id="show" hidden>Show HTML panel</button>
  <script>
    const panel = document.querySelector('#panel');
    const show = document.querySelector('#show');
    let count = 0;
    document.querySelector('#increment').addEventListener('click', () => {
      document.querySelector('#count').value = String(++count);
    });
    document.querySelectorAll('[name="position"]').forEach(control => control.addEventListener('change', event => {
      panel.dataset.position = event.target.value;
      layout();
    }));
    document.querySelector('#close').addEventListener('click', () => {
      panel.hidden = true;
      show.hidden = false;
      layout();
    });
    show.addEventListener('click', () => {
      panel.hidden = false;
      show.hidden = true;
      layout();
    });
    // Trusted embedded page only. Native CEF also denies external navigation
    // before loading and rejects new browser windows.
    document.addEventListener('click', event => {
      if (event.target.closest('a')) event.preventDefault();
    }, true);
    document.addEventListener('submit', event => event.preventDefault(), true);
    document.addEventListener('dragover', event => event.preventDefault());
    document.addEventListener('drop', event => event.preventDefault());
    const emit = payload => window.cef?.emit(payload);
    function layout() {
      const rects = [panel, show].filter(el => !el.hidden).map(el => {
        const r = el.getBoundingClientRect();
        return [r.x, r.y, r.width, r.height];
      });
      emit({kind: 'layout', rects});
    }
    let paused = false;
    let reportedReady = false;
    const pause = document.querySelector('#pause');
    pause.addEventListener('click', () => {
      emit({kind: 'command', command: {type: 'set_paused', paused: !paused}});
      // Do not claim success locally. The Rust state event acknowledges it.
      pause.disabled = true;
    });
    window.cef?.listen('space:state', json => {
      const state = JSON.parse(json);
      paused = state.paused;
      pause.textContent = paused ? 'Resume simulation' : 'Pause simulation';
      pause.disabled = false;
      document.querySelector('#paused').value = paused ? 'Paused' : 'Running';
      if (!reportedReady) {
        reportedReady = true;
        requestAnimationFrame(() => emit({kind: 'ready'}));
      }
    });
    window.cef?.listen('space:tick', json => {
      document.querySelector('#days').value = JSON.parse(json).days.toFixed(5);
    });
    window.cef?.listen('space:blur', () => document.activeElement?.blur());
    new ResizeObserver(layout).observe(panel);
    window.addEventListener('resize', layout);
    layout();
    // Reproducible DOM activity, explicitly not synthetic native keyboard events.
    const benchmarkMode = document.body.dataset.benchmark;
    if (benchmarkMode === 'active') {
      let step = 0;
      setInterval(() => {
        document.querySelector('#text').value = 'WASD R/F Q/E '.repeat(++step % 8 + 1);
        const text = document.querySelector('textarea');
        text.scrollTop = step % 2 ? text.scrollHeight : 0;
      }, 100);
    }
    if (benchmarkMode === 'animation') {
      const animate = () => {
        document.querySelector('#count').value = String(++count);
        document.querySelector('#increment').style.backgroundColor = count % 2 ? '#1b3b52' : '#10233a';
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
