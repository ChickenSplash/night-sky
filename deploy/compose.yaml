services:
  task-space:
    build: ./bundle
    image: task-space:local
    container_name: task-space
    restart: unless-stopped
    # Not bound to 192.168.1.90: at boot Docker starts before DHCP assigns it,
    # the bind fails and the restart policy never retries.
    ports:
      - "4321:4321"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    networks: [default, edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the cloudflared stack. The tunnel's public hostname points at
  # http://task-space:4321, which cloudflared resolves on this network.
  edge:
    name: edge
    external: true
