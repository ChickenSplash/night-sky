services:
  night-sky:
    build: ./bundle
    image: night-sky:local
    container_name: night-sky
    restart: unless-stopped
    # Not bound to 192.168.1.90: at boot Docker starts before DHCP assigns it,
    # the bind fails and the restart policy never retries.
    ports:
      - "4321:4321"
    volumes:
      - ./data:/app/data
    networks:
      default:
      edge:
        # The tunnel's public hostname still points at task-space:4321 in the
        # Cloudflare dashboard. Remove once it points at night-sky:4321.
        aliases: [task-space]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the cloudflared stack. The tunnel's public hostname points at
  # http://night-sky:4321, which cloudflared resolves on this network.
  edge:
    name: edge
    external: true
