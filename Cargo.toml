[workspace]
members = ["crates/client", "crates/server", "crates/shared", "crates/simulation", "crates/sim-worker"]
resolver = "2"
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
space-shared = { path = "crates/shared" }
space-simulation = { path = "crates/simulation" }
serde = { version = "1", features = ["derive"] }
# Craft snapshots must retain all f64 bits when read back for replay.
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[patch.crates-io]
# Skips frames instead of panicking on NVIDIA surface timeouts. See vendor/README.md.
bevy_render = { path = "vendor/bevy_render" }

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

# Galaxy generation runs in the client and in tests; unoptimised, it is slow.
[profile.dev.package.space-simulation]
opt-level = 3
